[package]
name = "mindmappercraft"
version = "0.1.0"
edition = "2021"
description = "MindMap-Editor für den Desktop, inspiriert vom Workflow von Xmind"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.29"
egui = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
